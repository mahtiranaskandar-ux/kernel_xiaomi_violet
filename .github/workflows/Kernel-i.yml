name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - genon
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: genon
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 🆕 تحرير مساحة القرص
    - name: Free up disk space
      run: |
        echo "🧹 تحرير مساحة القرص..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        echo "📊 المساحة المتاحة:"
        df -h

    # 3️⃣ Gonon Clang 18 مع دعم جميع أدوات ld.bfd
    - name: Setup Gonon Clang
      id: setup_clang
      run: |
        echo "📥 تحميل Gonon Clang 18..."
        
        GONON_URL="https://github.com/Gonon-Kernel/gonon-clang/releases/download/18.0.0git-20240105-release/GononClang-18.0.0git-20240105.tar.gz"
        
        wget -q "$GONON_URL" -O gonon-clang.tar.gz
        
        if [ ! -f "gonon-clang.tar.gz" ]; then
          echo "❌ فشل تحميل Gonon Clang!"
          exit 1
        fi
        
        echo "📦 فك الضغط..."
        mkdir -p gonon-clang
        tar -xf gonon-clang.tar.gz -C gonon-clang
        
        BIN_DIR=$(find "$PWD/gonon-clang" -name "bin" -type d | head -1)
        if [ -n "$BIN_DIR" ]; then
          CLANG_PATH="$BIN_DIR"
          echo "✅ وجد bin في: $CLANG_PATH"
        else
          echo "❌ لم يتم العثور على مجلد bin!"
          exit 1
        fi
        
        rm -f gonon-clang.tar.gz
        
        # الكشف عن clang
        CLANG_BIN=$(find "$CLANG_PATH" -name "clang-[0-9]*" -type f | head -1)
        if [ -z "$CLANG_BIN" ]; then
          CLANG_BIN=$(find "$CLANG_PATH" -name "clang" -type f | head -1)
        fi
        
        if [ -z "$CLANG_BIN" ]; then
          echo "❌ لم يتم العثور على clang!"
          exit 1
        fi
        
        CLANG_BASENAME=$(basename "$CLANG_BIN")
        echo "✅ وجد clang: $CLANG_BASENAME"
        
        # إنشاء روابط رمزية
        if [ "$CLANG_BASENAME" != "clang" ] && [ ! -L "$CLANG_PATH/clang" ]; then
          ln -sf "$CLANG_BASENAME" "$CLANG_PATH/clang"
          echo "🔗 clang -> $CLANG_BASENAME"
        fi
        
        if [ ! -L "$CLANG_PATH/clang++" ]; then
          CLANGPP_BIN=$(find "$CLANG_PATH" -name "clang++-[0-9]*" -type f | head -1)
          if [ -n "$CLANGPP_BIN" ]; then
            ln -sf "$(basename "$CLANGPP_BIN")" "$CLANG_PATH/clang++"
            echo "🔗 clang++ -> $(basename "$CLANGPP_BIN")"
          else
            ln -sf "clang" "$CLANG_PATH/clang++"
            echo "🔗 clang++ -> clang"
          fi
        fi
        
        # ⭐⭐ اكتشاف جميع أدوات ld.bfd ⭐⭐
        echo ""
        echo "🔍 اكتشاف جميع أدوات ld.bfd المتاحة..."
        
        LD_TOOLS_FOUND=()
        
        # 1. aarch64-linux-gnu-ld.bfd (للنواة 64-bit)
        if [ -f "$CLANG_PATH/aarch64-linux-gnu-ld.bfd" ]; then
          echo "✅ aarch64-linux-gnu-ld.bfd (3.91 ميجا) - للنواة 64-bit"
          LD_TOOLS_FOUND+=("aarch64")
        fi
        
        # 2. arm-linux-gnueabi-ld.bfd (للنواة 32-bit/VDSO)
        if [ -f "$CLANG_PATH/arm-linux-gnueabi-ld.bfd" ]; then
          echo "✅ arm-linux-gnueabi-ld.bfd (2.00 ميجا) - للنواة 32-bit/VDSO"
          LD_TOOLS_FOUND+=("arm32")
        fi
        
        # 3. ld.bfd (عام)
        if [ -f "$CLANG_PATH/ld.bfd" ]; then
          echo "✅ ld.bfd (2.70 ميجا) - عام"
          LD_TOOLS_FOUND+=("generic")
        fi
        
        echo "🎯 تم العثور على ${#LD_TOOLS_FOUND[@]} أدوات ld.bfd"
        
        # ⭐⭐ إنشاء روابط رمزية ذكية ⭐⭐
        echo ""
        echo "🔗 إنشاء روابط رمزية ذكية..."
        
        # 1. إنشاء رابط ld العام
        if [ -f "$CLANG_PATH/ld.bfd" ] && [ ! -L "$CLANG_PATH/ld" ]; then
          ln -sf "ld.bfd" "$CLANG_PATH/ld"
          echo "🔗 ld -> ld.bfd"
        fi
        
        # 2. إنشاء رابط aarch64-linux-gnu-ld إذا لزم الأمر
        if [ -f "$CLANG_PATH/aarch64-linux-gnu-ld.bfd" ] && [ ! -L "$CLANG_PATH/aarch64-linux-gnu-ld" ]; then
          ln -sf "aarch64-linux-gnu-ld.bfd" "$CLANG_PATH/aarch64-linux-gnu-ld"
          echo "🔗 aarch64-linux-gnu-ld -> aarch64-linux-gnu-ld.bfd"
        fi
        
        # 3. إنشاء رابط arm-linux-gnueabi-ld إذا لزم الأمر
        if [ -f "$CLANG_PATH/arm-linux-gnueabi-ld.bfd" ] && [ ! -L "$CLANG_PATH/arm-linux-gnueabi-ld" ]; then
          ln -sf "arm-linux-gnueabi-ld.bfd" "$CLANG_PATH/arm-linux-gnueabi-ld"
          echo "🔗 arm-linux-gnueabi-ld -> arm-linux-gnueabi-ld.bfd"
        fi
        
        # ⭐⭐ تعيين متغيرات LLVM ⭐⭐
        echo ""
        echo "🔧 تعيين متغيرات LLVM..."
        
        # حفظ المسارات
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "CLANG_BIN_NAME=$CLANG_BASENAME" >> $GITHUB_ENV
        
        # 1. المترجمات
        echo "CC=$CLANG_PATH/clang" >> $GITHUB_ENV
        echo "HOSTCC=$CLANG_PATH/clang" >> $GITHUB_ENV
        echo "HOSTCXX=$CLANG_PATH/clang++" >> $GITHUB_ENV
        
        # 2. أدوات LLVM الأساسية
        echo "AR=$CLANG_PATH/llvm-ar" >> $GITHUB_ENV
        echo "NM=$CLANG_PATH/llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=$CLANG_PATH/llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=$CLANG_PATH/llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=$CLANG_PATH/llvm-strip" >> $GITHUB_ENV
        
        # 3. ⭐⭐ استخدام ld.bfd العام ⭐⭐
        # النواة ستعثر على الأدوات المتخصصة تلقائياً من PATH
        echo "LD=$CLANG_PATH/ld.bfd" >> $GITHUB_ENV
        echo "LDFLAGS=-fuse-ld=bfd" >> $GITHUB_ENV
        
        # 4. إضافة إلى PATH (مهم جداً!)
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        echo ""
        echo "🎯 Gonon Clang جاهز مع ${#LD_TOOLS_FOUND[@]} أدوات ld.bfd!"

    # 🆕 التحقق التلقائي من Gonon Clang
    - name: Verify Gonon Clang Auto-Detection
      run: |
        echo "🔍 التحقق التلقائي من Gonon Clang..."
        
        echo "📋 معلومات Gonon Clang المكتشف:"
        echo "CLANG_PATH: $CLANG_PATH"
        echo "CLANG_BIN_NAME: $CLANG_BIN_NAME"
        
        echo "🔎 أدوات ld.bfd المتاحة في PATH:"
        which ld.bfd && echo "✅ ld.bfd" || echo "❌ ld.bfd"
        which aarch64-linux-gnu-ld.bfd 2>/dev/null && echo "✅ aarch64-linux-gnu-ld.bfd" || echo "❌ aarch64-linux-gnu-ld.bfd"
        which arm-linux-gnueabi-ld.bfd 2>/dev/null && echo "✅ arm-linux-gnueabi-ld.bfd" || echo "❌ arm-linux-gnueabi-ld.bfd"
        
        echo "📊 معلومات clang:"
        clang --version | head -3

    # 4️⃣ Export env
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel
    - name: Build kernel
      shell: bash
      env:
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        CLANG_TRIPLE: aarch64-linux-gnu-
        # ⭐⭐ متغيرات LLVM ⭐⭐
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
        LD: ${{ env.LD }}
        LDFLAGS: ${{ env.LDFLAGS }}
      run: |
        set -o pipefail
        mkdir -p logs
        
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء بناء النواة باستخدام Gonon Clang..."
        echo "=========================================="
        
        # ⭐⭐ عرض جميع أدوات ld.bfd المتاحة ⭐⭐
        echo "🔍 أدوات ld.bfd المتاحة في PATH:"
        for tool in ld.bfd aarch64-linux-gnu-ld.bfd arm-linux-gnueabi-ld.bfd; do
          if command -v "$tool" >/dev/null 2>&1; then
            TOOL_PATH=$(command -v "$tool")
            SIZE=$(ls -lh "$TOOL_PATH" | awk '{print $5}')
            echo "✅ $tool: $SIZE ($TOOL_PATH)"
          else
            echo "❌ $tool: غير متوفر"
          fi
        done
        
        echo ""
        echo "🔧 أدوات LLVM المستخدمة:"
        echo "CC: ccache clang"
        echo "AR: $(basename "$AR")"
        echo "NM: $(basename "$NM")"
        echo "OBJCOPY: $(basename "$OBJCOPY")"
        echo "STRIP: $(basename "$STRIP")"
        echo "LD: $(basename "$LD")"
        echo "LDFLAGS: $LDFLAGS"
        
        # ⭐⭐ البناء ⭐⭐
        stdbuf -oL -eL make O=out -j$(nproc) \
        CC="ccache clang" \
        AR="$AR" \
        NM="$NM" \
        OBJCOPY="$OBJCOPY" \
        OBJDUMP="$OBJDUMP" \
        STRIP="$STRIP" \
        LD="$LD" \
        LDFLAGS="$LDFLAGS" \
        CLANG_TRIPLE="$CLANG_TRIPLE" \
        CROSS_COMPILE="$CROSS_COMPILE" \
        CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
        LLVM=1 \
        LLVM_IAS=1 \
        2>&1 | tee logs/build.log
        
        BUILD_STATUS=${PIPESTATUS[0]}
        
        ccache -s
        
        if [ $BUILD_STATUS -eq 0 ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح!"
            ls -lh out/arch/arm64/boot/Image.gz
        else
            echo "❌ فشل بناء النواة!"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    
    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-gonon-clang-18.zip *
        cd ..
        
        echo "📏 حجم ZIP:"
        ls -lh Kernel-violet-gonon-clang-18.zip
        echo "✅ تم إنشاء ZIP"
    
    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-gonon-clang-18.zip Kernel-violet-gonon-clang-18-signed.zip
        
        echo "📏 حجم ZIP الموقّع:"
        ls -lh Kernel-violet-gonon-clang-18-signed.zip
        echo "✅ تم التوقيع"
    
    # 🔟 رفع ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Gonon-Clang-18-ZIP
        path: Kernel-violet-gonon-clang-18-signed.zip
    
    # 1️⃣1️⃣ رفع اللوغات والتحليلات
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis-Gonon
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt

    # ملخص البناء
    - name: Build Summary
      if: always()
      run: |
        echo "📊 ملخص البناء باستخدام Gonon Clang 18:"
        echo "================================"
        echo "🔧 Gonon Clang المستخدم: $CLANG_BIN_NAME"
        echo "📁 مسار Clang: $CLANG_PATH"
        echo ""
        echo "🔗 أدوات ld.bfd المستخدمة:"
        for tool in ld.bfd aarch64-linux-gnu-ld.bfd arm-linux-gnueabi-ld.bfd; do
          if command -v "$tool" >/dev/null 2>&1; then
            echo "  • $tool: متوفر"
          fi
        done
        echo ""
        echo "✅ ملفات تم إنشاؤها:"
        ls -lh Kernel-violet-gonon-clang-18-signed.zip 2>/dev/null || echo "❌ ZIP غير موجود"
        ls -lh logs/build.log 2>/dev/null || echo "❌ اللوغ غير موجود"
        echo "================================"

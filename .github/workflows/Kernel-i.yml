name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - xweeb
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: xweeb
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ WeebX Clang 19.1.5 ⭐⭐ معدل ليكون مثل Bash ⭐⭐
    - name: Setup WeebX Clang 19.1.5
      id: setup_clang
      run: |
        echo "📥 تحميل WeebX Clang 19.1.5..."
        wget -q "https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz" -O weebx-clang.tar.gz
        
        mkdir -p weebx-clang
        tar -xzf weebx-clang.tar.gz -C weebx-clang --strip-components=1
        
        CLANG_PATH="$PWD/weebx-clang/bin"
        
        # ⭐⭐ مثل Bash: إضافة إلى PATH فقط ⭐⭐
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        # حفظ المسار للاستخدام لاحقاً
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        
        echo "✅ WeebX Clang 19.1.5 جاهز!"

    # 4️⃣ Export env 
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel ⭐⭐ مطابق لـ Bash تماماً ⭐⭐
    - name: Build kernel
      shell: bash
      env:
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        CLANG_TRIPLE: aarch64-linux-gnu-
      run: |
        set -o pipefail
        mkdir -p logs
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء بناء النواة..."
        echo "🔧 Clang المستخدم: $(which clang)"
        echo "🔧 Clang الإصدار:"
        clang --version | head -2
        
        echo "🔧 CROSS_COMPILE: $CROSS_COMPILE"
        echo "🔧 CROSS_COMPILE_ARM32: $CROSS_COMPILE_ARM32"
        echo "🔧 CLANG_TRIPLE: $CLANG_TRIPLE"
        
        # ⭐⭐ مثل Bash تماماً: استخدام "ccache clang" ⭐⭐
        # ⭐⭐ بدون مسافات بعد \ ⭐⭐
        stdbuf -oL -eL make O=out -j$(nproc) \
        CC="ccache clang" \
        CLANG_TRIPLE="$CLANG_TRIPLE" \
        CROSS_COMPILE="$CROSS_COMPILE" \
        CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
        LLVM=1 \
        LLVM_IAS=1 \
        2>&1 | tee logs/build.log
        
        ccache -s
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح!"
        else
            echo "❌ فشل بناء النواة!"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    
    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-weebx-clang.zip *
        echo "✅ تم إنشاء Kernel-violet-weebx-clang.zip"
    
    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ملف ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-weebx-clang.zip Kernel-violet-weebx-clang-signed.zip
        echo "✅ تم التوقيع: Kernel-violet-weebx-clang-signed.zip"
    
    # 🔟 رفع ملف ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-WeebX-Clang-ZIP
        path: |
          Kernel-violet-weebx-clang-signed.zip
    
    # 1️⃣1️⃣ رفع اللوغات والتحليلات
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis-WeebX
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt

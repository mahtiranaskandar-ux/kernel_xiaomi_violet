name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - test7
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test7
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ AOSP Clang مع الكشف التلقائي ⭐⭐ مثل ZyCromerZ ⭐⭐
    - name: Setup AOSP Clang
      id: setup_clang
      run: |
        echo "📥 تحميل AOSP Clang..."
        
        # ⭐⭐ رابط AOSP Clang ⭐⭐
        AOSP_CLANG_URL="https://android.googlesource.com/platform//prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-15.0.0_r13/clang-r498229b.tar.gz"
        
        wget -q "$AOSP_CLANG_URL" -O aosp-clang.tar.gz
        
        echo "📦 فك الضغط..."
        mkdir -p aosp-clang
        tar -xf aosp-clang.tar.gz -C aosp-clang
        
        rm -f aosp-clang.tar.gz
        
        CLANG_PATH="$PWD/aosp-clang/bin"
        
        # ⭐⭐ الكشف التلقائي عن إصدار Clang ⭐⭐
        echo "🔍 الكشف التلقائي عن AOSP Clang..."
        
        # البحث عن أي clang-* في AOSP Clang
        CLANG_BIN=$(find "$CLANG_PATH" -name "clang-[0-9]*" -type f | head -1)
        
        if [ -z "$CLANG_BIN" ]; then
          # محاولة أخرى: البحث عن أي ملف يبدأ بـ clang
          CLANG_BIN=$(find "$CLANG_PATH" -name "clang*" -type f ! -name "*.so" ! -name "*.dll" | head -1)
        fi
        
        if [ -z "$CLANG_BIN" ]; then
          echo "❌ لم يتم العثور على clang في $CLANG_PATH"
          echo "📋 محتويات مجلد AOSP Clang:"
          ls -la "$CLANG_PATH/" | head -30
          exit 1
        fi
        
        CLANG_BASENAME=$(basename "$CLANG_BIN")
        echo "✅ وجد AOSP Clang: $CLANG_BASENAME"
        
        # ⭐⭐ إنشاء رابط رمزي clang ⭐⭐
        if [ ! -L "$CLANG_PATH/clang" ] && [ ! -f "$CLANG_PATH/clang" ]; then
          echo "🔗 إنشاء رابط رمزي: clang -> $CLANG_BASENAME"
          ln -sf "$CLANG_BASENAME" "$CLANG_PATH/clang"
        fi
        
        # ⭐⭐ البحث عن clang++ المقابل ⭐⭐
        # محاولة 1: استبدال clang بـ clang++
        CLANGPP_PATTERN1=$(echo "$CLANG_BASENAME" | sed 's/^clang/clang++/')
        # محاولة 2: إضافة ++ للنهاية
        CLANGPP_PATTERN2="${CLANG_BASENAME}++"
        
        CLANGPP_BIN=""
        if [ -f "$CLANG_PATH/$CLANGPP_PATTERN1" ]; then
          CLANGPP_BIN="$CLANG_PATH/$CLANGPP_PATTERN1"
        elif [ -f "$CLANG_PATH/$CLANGPP_PATTERN2" ]; then
          CLANGPP_BIN="$CLANG_PATH/$CLANGPP_PATTERN2"
        else
          # البحث عن أي clang++
          CLANGPP_BIN=$(find "$CLANG_PATH" -name "clang++*" -type f | head -1)
        fi
        
        if [ -n "$CLANGPP_BIN" ]; then
          CLANGPP_BASENAME=$(basename "$CLANGPP_BIN")
          echo "✅ وجد Clang++: $CLANGPP_BASENAME"
          
          if [ ! -L "$CLANG_PATH/clang++" ] && [ ! -f "$CLANG_PATH/clang++" ]; then
            echo "🔗 إنشاء رابط رمزي: clang++ -> $CLANGPP_BASENAME"
            ln -sf "$CLANGPP_BASENAME" "$CLANG_PATH/clang++"
          fi
        else
          echo "⚠️  لم يتم العثور على clang++ في AOSP Clang"
        fi
        
        # التحقق من أدوات LLVM الأساسية
        echo "🔧 التحقق من أدوات LLVM في AOSP Clang..."
        REQUIRED_TOOLS="llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip"
        for tool in $REQUIRED_TOOLS; do
          if [ -f "$CLANG_PATH/$tool" ]; then
            echo "✅ $tool موجود"
          else
            echo "⚠️  $tool غير موجود - قد يسبب مشاكل"
          fi
        done
        
        echo "📋 محتويات مجلد AOSP Clang (مختصر):"
        ls -la "$CLANG_PATH/" | grep -E "^l.*clang|^[^d].*(clang|llvm)" | head -15 2>/dev/null || true
        
        # إضافة إلى PATH
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        # حفظ معلومات Clang للمراحل التالية
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "CLANG_BIN_NAME=$CLANG_BASENAME" >> $GITHUB_ENV
        
        echo "🎯 AOSP Clang جاهز! ($CLANG_BASENAME)"

    # 🆕 التحقق التلقائي من AOSP Clang
    - name: Verify AOSP Clang Auto-Detection
      run: |
        echo "🔍 التحقق التلقائي من AOSP Clang..."
        
        echo "📋 معلومات AOSP Clang المكتشف:"
        echo "CLANG_PATH: $CLANG_PATH"
        echo "CLANG_BIN_NAME: $CLANG_BIN_NAME"
        
        echo "🔎 البحث عن clang في PATH:"
        which clang || { echo "❌ clang غير موجود في PATH"; exit 1; }
        
        CLANG_ACTUAL=$(which clang)
        echo "✅ clang موجود في: $CLANG_ACTUAL"
        
        # التحقق من الرابط الرمزي
        if [ -L "$CLANG_ACTUAL" ]; then
          REAL_CLANG=$(readlink -f "$CLANG_ACTUAL")
          echo "🔗 clang هو رابط رمزي إلى: $REAL_CLANG"
          
          if [ -f "$REAL_CLANG" ]; then
            echo "✅ الملف الحقيقي موجود"
            echo "📊 حجم الملف: $(ls -lh "$REAL_CLANG" | awk '{print $5}')"
          else
            echo "❌ الملف الحقيقي غير موجود!"
            exit 1
          fi
        fi
        
        echo "📊 معلومات AOSP Clang:"
        clang --version | head -5
        
        # التحقق من الإصدار المحدد
        if [ -n "$CLANG_BIN_NAME" ]; then
          echo "🔍 التحقق من الإصدار المحدد ($CLANG_BIN_NAME):"
          "$CLANG_PATH/$CLANG_BIN_NAME" --version | head -3
        fi
        
        echo "✅ التحقق التلقائي من AOSP Clang اكتمل!"

    # 4️⃣ Export env
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel مع التحقق التلقائي
    - name: Build kernel
      shell: bash
      env:
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        CLANG_TRIPLE: aarch64-linux-gnu-
      run: |
        set -o pipefail
        mkdir -p logs
        
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء بناء النواة باستخدام AOSP Clang..."
        
        # التحقق النهائي التلقائي
        echo "🔍 التحقق النهائي التلقائي:"
        echo "🔧 AOSP Clang المستخدم: $(which clang)"
        echo "🔧 المسار الحقيقي: $(readlink -f $(which clang) 2>/dev/null || which clang)"
        echo "🔧 الإصدار المكتشف: $CLANG_BIN_NAME"
        
        echo "📋 معلومات AOSP Clang النهائية:"
        clang --version | head -3
        
        echo "🔧 CROSS_COMPILE: $CROSS_COMPILE"
        echo "🔧 CROSS_COMPILE_ARM32: $CROSS_COMPILE_ARM32"
        echo "🔧 CLANG_TRIPLE: $CLANG_TRIPLE"
        
        # البناء باستخدام AOSP Clang المكتشف تلقائياً
        stdbuf -oL -eL make O=out -j$(nproc) \
        CC="ccache clang" \
        CLANG_TRIPLE="$CLANG_TRIPLE" \
        CROSS_COMPILE="$CROSS_COMPILE" \
        CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
        LLVM=1 \
        LLVM_IAS=1 \
        2>&1 | tee logs/build.log
        
        BUILD_STATUS=${PIPESTATUS[0]}
        
        ccache -s
        
        if [ $BUILD_STATUS -eq 0 ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح باستخدام AOSP $CLANG_BIN_NAME!"
            ls -lh out/arch/arm64/boot/Image.gz
        else
            echo "❌ فشل بناء النواة!"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    
    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-aosp.zip *
        cd ..
        
        echo "📏 حجم ZIP:"
        ls -lh Kernel-violet-aosp.zip
        echo "✅ تم إنشاء ZIP"
    
    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-aosp.zip Kernel-violet-aosp-signed.zip
        
        echo "📏 حجم ZIP الموقّع:"
        ls -lh Kernel-violet-aosp-signed.zip
        echo "✅ تم التوقيع"
    
    # 🔟 رفع ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-AOSP-Clang-ZIP
        path: Kernel-violet-aosp-signed.zip
    
    # 1️⃣1️⃣ رفع اللوغات والتحليلات
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis-AOSP
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt

    # ملخص البناء
    - name: Build Summary
      if: always()
      run: |
        echo "📊 ملخص البناء باستخدام AOSP Clang:"
        echo "================================"
        echo "🔧 AOSP Clang المستخدم: $CLANG_BIN_NAME"
        echo "📁 مسار Clang: $CLANG_PATH"
        echo ""
        echo "✅ ملفات تم إنشاؤها:"
        ls -lh Kernel-violet-aosp-signed.zip 2>/dev/null || echo "❌ ZIP غير موجود"
        ls -lh logs/build.log 2>/dev/null || echo "❌ اللوغ غير موجود"
        ls -lh nm-*.txt 2>/dev/null || echo "❌ ملفات التحليل غير موجودة"
        echo "================================"

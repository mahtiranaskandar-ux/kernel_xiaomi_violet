name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - genon

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: genon
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 🆕 تحرير مساحة القرص
    - name: Free up disk space
      run: |
        echo "🧹 تحرير مساحة القرص..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        echo "📊 المساحة المتاحة:"
        df -h

    # 3️⃣ Gonon Clang 18 مع اختيار ld.bfd الصحيح
    - name: Setup Gonon Clang with correct ld.bfd
      id: setup_clang
      run: |
        echo "📥 تحميل Gonon Clang 18..."
        
        GONON_URL="https://github.com/Gonon-Kernel/gonon-clang/releases/download/18.0.0git-20240105-release/GononClang-18.0.0git-20240105.tar.gz"
        
        wget -q "$GONON_URL" -O gonon-clang.tar.gz
        
        if [ ! -f "gonon-clang.tar.gz" ]; then
          echo "❌ فشل تحميل Gonon Clang!"
          exit 1
        fi
        
        echo "📦 فك الضغط..."
        mkdir -p gonon-clang
        tar -xf gonon-clang.tar.gz -C gonon-clang
        
        # البحث عن مجلد bin
        BIN_DIR=$(find "$PWD/gonon-clang" -name "bin" -type d | head -1)
        if [ -n "$BIN_DIR" ]; then
          CLANG_PATH="$BIN_DIR"
          echo "✅ وجد bin في: $CLANG_PATH"
        else
          echo "❌ لم يتم العثور على مجلد bin!"
          exit 1
        fi
        
        rm -f gonon-clang.tar.gz
        
        # الكشف عن clang
        echo "🔍 الكشف عن clang..."
        CLANG_BIN=$(find "$CLANG_PATH" -name "clang-[0-9]*" -type f | head -1)
        if [ -z "$CLANG_BIN" ]; then
          CLANG_BIN=$(find "$CLANG_PATH" -name "clang" -type f | head -1)
        fi
        
        if [ -z "$CLANG_BIN" ]; then
          echo "❌ لم يتم العثور على clang!"
          exit 1
        fi
        
        CLANG_BASENAME=$(basename "$CLANG_BIN")
        echo "✅ وجد clang: $CLANG_BASENAME"
        
        # إنشاء روابط رمزية
        if [ "$CLANG_BASENAME" != "clang" ] && [ ! -L "$CLANG_PATH/clang" ]; then
          ln -sf "$CLANG_BASENAME" "$CLANG_PATH/clang"
          echo "🔗 clang -> $CLANG_BASENAME"
        fi
        
        if [ ! -L "$CLANG_PATH/clang++" ]; then
          CLANGPP_BIN=$(find "$CLANG_PATH" -name "clang++-[0-9]*" -type f | head -1)
          if [ -n "$CLANGPP_BIN" ]; then
            ln -sf "$(basename "$CLANGPP_BIN")" "$CLANG_PATH/clang++"
            echo "🔗 clang++ -> $(basename "$CLANGPP_BIN")"
          else
            ln -sf "clang" "$CLANG_PATH/clang++"
            echo "🔗 clang++ -> clang"
          fi
        fi
        
        # ⭐⭐ اختيار ld.bfd المناسب ⭐⭐
        echo ""
        echo "🔍 اختيار أداة الربط المناسبة..."
        
        # استخدام aarch64-linux-gnu-ld.bfd للأفضل (3.19 ميجا)
        if [ -f "$CLANG_PATH/aarch64-linux-gnu-ld.bfd" ]; then
          LD_MAIN="$CLANG_PATH/aarch64-linux-gnu-ld.bfd"
          echo "✅ اختيار: aarch64-linux-gnu-ld.bfd (3.19 ميجا) - الأفضل للنواة 64-bit"
        elif [ -f "$CLANG_PATH/ld.bfd" ]; then
          LD_MAIN="$CLANG_PATH/ld.bfd"
          echo "⚠️  اختيار: ld.bfd (2.70 ميجا) - بديل"
        else
          echo "❌ لم يتم العثور على ld.bfd!"
          exit 1
        fi
        
        # ⭐⭐ تعيين جميع متغيرات LLVM المطلوبة ⭐⭐
        echo ""
        echo "🔧 تعيين متغيرات LLVM كما في التعليمات..."
        
        # حفظ المعلومات الأساسية
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "CLANG_BIN_NAME=$CLANG_BASENAME" >> $GITHUB_ENV
        
        # 1. المترجمات
        echo "CC=$CLANG_PATH/clang" >> $GITHUB_ENV
        echo "HOSTCC=$CLANG_PATH/clang" >> $GITHUB_ENV
        echo "HOSTCXX=$CLANG_PATH/clang++" >> $GITHUB_ENV
        
        # 2. ⭐⭐ أدوات LLVM المطلوبة (AR, NM, OBJCOPY, OBJDUMP, STRIP) ⭐⭐
        echo "AR=$CLANG_PATH/llvm-ar" >> $GITHUB_ENV
        echo "NM=$CLANG_PATH/llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=$CLANG_PATH/llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=$CLANG_PATH/llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=$CLANG_PATH/llvm-strip" >> $GITHUB_ENV
        
        # 3. ⭐⭐ أداة الربط ld.bfd ⭐⭐
        echo "LD=$LD_MAIN" >> $GITHUB_ENV
        echo "CROSS_COMPILE_LD=$LD_MAIN" >> $GITHUB_ENV
        
        # 4. إعدادات الربط
        echo "LDFLAGS=-fuse-ld=bfd" >> $GITHUB_ENV
        echo "KBUILD_LDFLAGS=-fuse-ld=bfd" >> $GITHUB_ENV
        
        # 5. إضافة إلى PATH
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        echo ""
        echo "🎯 Gonon Clang جاهز مع جميع متغيرات LLVM!"

    # 4️⃣ Export env
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        echo "⚙️ تحميل defconfig..."
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel مع جميع متغيرات LLVM
    - name: Build kernel with all LLVM variables
      shell: bash
      env:
        # ⭐⭐ متغيرات LLVM من Gonon Clang ⭐⭐
        CC: ${{ env.CC }}
        HOSTCC: ${{ env.HOSTCC }}
        HOSTCXX: ${{ env.HOSTCXX }}
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
        # ⭐⭐ أداة الربط ld.bfd ⭐⭐
        LD: ${{ env.LD }}
        CROSS_COMPILE_LD: ${{ env.CROSS_COMPILE_LD }}
        LDFLAGS: ${{ env.LDFLAGS || '-fuse-ld=bfd' }}
        # إعدادات البناء
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        CLANG_TRIPLE: aarch64-linux-gnu-
        LLVM: 1
        LLVM_IAS: 1
      run: |
        set -o pipefail
        mkdir -p logs
        
        ccache -M 2G
        ccache -z
        
        echo "🚀 بدء بناء النواة مع جميع متغيرات LLVM..."
        echo "=========================================="
        
        # التحقق من جميع الأدوات
        echo "🔍 التحقق من أدوات LLVM:"
        echo ""
        
        TOOLS=(
          "CC:$CC"
          "HOSTCC:$HOSTCC" 
          "HOSTCXX:$HOSTCXX"
          "AR:$AR"
          "NM:$NM"
          "OBJCOPY:$OBJCOPY"
          "STRIP:$STRIP"
          "LD:$LD"
        )
        
        for tool_info in "${TOOLS[@]}"; do
          tool_name="${tool_info%%:*}"
          tool_path="${tool_info##*:}"
          
          if [ -n "$tool_path" ] && [ -x "$tool_path" ]; then
            echo "✅ $tool_name: $(basename "$tool_path")"
            echo "   📍 $tool_path"
          else
            echo "❌ $tool_name: غير صالح ($tool_path)"
          fi
        done
        
        # تحقق خاص من ld.bfd
        echo ""
        echo "🔗 تحقق من أداة الربط:"
        if [ -f "$LD" ]; then
          echo "✅ LD: $(basename "$LD")"
          echo "   📊 حجم: $(ls -lh "$LD" | awk '{print $5}')"
          echo "   📍 مسار: $LD"
        else
          echo "❌ ملف LD غير موجود: $LD"
        fi
        
        echo ""
        echo "🔧 إعدادات البناء النهائية:"
        echo "=========================="
        echo "CC: ccache clang"
        echo "AR: $(basename "$AR")"
        echo "NM: $(basename "$NM")" 
        echo "OBJCOPY: $(basename "$OBJCOPY")"
        echo "STRIP: $(basename "$STRIP")"
        echo "LD: $(basename "$LD") ⭐"
        echo "LDFLAGS: $LDFLAGS"
        echo "CROSS_COMPILE: $CROSS_COMPILE"
        echo "LLVM: $LLVM"
        echo "LLVM_IAS: $LLVM_IAS"
        echo "=========================="
        
        echo ""
        echo "🔨 بدء عملية البناء..."
        echo "=========================================="
        
        # ⭐⭐ البناء مع جميع متغيرات LLVM ⭐⭐
        stdbuf -oL -eL make O=out -j$(nproc) \
        CC="ccache clang" \
        HOSTCC="$HOSTCC" \
        HOSTCXX="$HOSTCXX" \
        AR="$AR" \
        NM="$NM" \
        OBJCOPY="$OBJCOPY" \
        OBJDUMP="$OBJDUMP" \
        STRIP="$STRIP" \
        LD="$LD" \
        CROSS_COMPILE_LD="$CROSS_COMPILE_LD" \
        LDFLAGS="$LDFLAGS" \
        CLANG_TRIPLE="$CLANG_TRIPLE" \
        CROSS_COMPILE="$CROSS_COMPILE" \
        CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
        LLVM="$LLVM" \
        LLVM_IAS="$LLVM_IAS" \
        2>&1 | tee logs/build.log
        
        BUILD_STATUS=${PIPESTATUS[0]}
        
        echo ""
        echo "📊 إحصائيات ccache:"
        ccache -s
        
        if [ $BUILD_STATUS -eq 0 ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo ""
            echo "✅ ✅ ✅ تم بناء النواة بنجاح! ✅ ✅ ✅"
            echo ""
            echo "📁 الملف الناتج:"
            ls -lh out/arch/arm64/boot/Image.gz
            [ -f "out/arch/arm64/boot/dtbo.img" ] && ls -lh out/arch/arm64/boot/dtbo.img
            echo ""
            echo "🎉 البناء اكتمل باستخدام جميع أدوات LLVM!"
        else
            echo ""
            echo "❌ فشل بناء النواة!"
            echo "🔍 الأخطاء الأخيرة:"
            tail -100 logs/build.log | grep -i "error\|undefined" | head -20 || tail -50 logs/build.log
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            echo "🔎 البحث عن رموز KSU..."
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt 2>/dev/null || echo "⚠️  لم يتم العثور على رموز KSU" > nm-ksu.txt
            
            echo "🔎 البحث عن رموز susfs..."
            nm out/vmlinux | grep -i susfs > nm-susfs.txt 2>/dev/null || echo "⚠️  لم يتم العثور على رموز susfs" > nm-susfs.txt
            
            echo "📝 جمع جميع الرموز..."
            nm out/vmlinux > nm-full.txt 2>/dev/null || echo "❌ فشل جمع الرموز" > nm-full.txt
            
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    
    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          cp out/arch/arm64/boot/dtbo.img AK3/
          echo "✅ تم نسخ dtbo.img"
        fi
        
        cd AK3
        zip -r9 ../Kernel-violet-gonon-llvm.zip *
        cd ..
        
        echo "📏 حجم ZIP:"
        ls -lh Kernel-violet-gonon-llvm.zip
        echo "✅ تم إنشاء ZIP"

    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-gonon-llvm.zip Kernel-violet-gonon-llvm-signed.zip
        
        echo "📏 حجم ZIP الموقّع:"
        ls -lh Kernel-violet-gonon-llvm-signed.zip
        echo "✅ تم التوقيع"

    # 🔟 رفع ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Gonon-LLVM
        path: |
          Kernel-violet-gonon-llvm-signed.zip
          build_info.txt

    # 1️⃣1️⃣ رفع اللوغات والتحليلات
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt

    # ملخص البناء
    - name: Build Summary
      if: always()
      run: |
        echo "📊 📊 📊 ملخص البناء 📊 📊 📊"
        echo "=========================================="
        echo "🎯 Gonon Clang 18 مع LLVM Tools"
        echo "=========================================="
        echo ""
        echo "🔧 الأدوات المستخدمة:"
        echo "  • Clang: $CLANG_BIN_NAME"
        echo "  • AR: $(basename "$AR" 2>/dev/null || echo 'N/A')"
        echo "  • NM: $(basename "$NM" 2>/dev/null || echo 'N/A')"
        echo "  • OBJCOPY: $(basename "$OBJCOPY" 2>/dev/null || echo 'N/A')"
        echo "  • STRIP: $(basename "$STRIP" 2>/dev/null || echo 'N/A')"
        echo "  • LD: $(basename "$LD" 2>/dev/null || echo 'N/A') ⭐"
        echo ""
        echo "✅ المخرجات:"
        if [ -f "Kernel-violet-gonon-llvm-signed.zip" ]; then
          echo "  • Kernel ZIP: $(ls -lh Kernel-violet-gonon-llvm-signed.zip | awk '{print $5}')"
        else
          echo "  • Kernel ZIP: ❌ غير موجود"
        fi
        echo ""
        echo "📁 التحليلات:"
        ls -lh nm-*.txt 2>/dev/null | wc -l | xargs echo "  • عدد ملفات التحليل:"
        echo ""
        echo "=========================================="
        echo "🎉 العملية اكتملت!"
        echo "=========================================="

name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - genon
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: genon
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 🆕 تحرير مساحة القرص
    - name: Free up disk space
      run: |
        echo "🧹 تحرير مساحة القرص..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        echo "📊 المساحة المتاحة:"
        df -h

    # 3️⃣ Gonon Clang 18 مع الكشف التلقائي ⭐⭐
    - name: Setup Gonon Clang
      id: setup_clang
      run: |
        echo "📥 تحميل Gonon Clang 18..."
        
        # ⭐⭐ رابط Gonon Clang الجديد ⭐⭐
        GONON_URL="https://github.com/Gonon-Kernel/gonon-clang/releases/download/18.0.0git-20240105-release/GononClang-18.0.0git-20240105.tar.gz"
        
        wget -q "$GONON_URL" -O gonon-clang.tar.gz
        
        # التحقق من التحميل
        if [ ! -f "gonon-clang.tar.gz" ]; then
          echo "❌ فشل تحميل Gonon Clang!"
          echo "🔗 الرابط: $GONON_URL"
          exit 1
        fi
        
        echo "📦 فك الضغط..."
        mkdir -p gonon-clang
        tar -xf gonon-clang.tar.gz -C gonon-clang
        
        # التحقق من فك الضغط
        if [ ! -d "gonon-clang/bin" ]; then
          echo "⚠️  بنية مجلد مختلفة، البحث عن bin..."
          # البحث عن مجلد bin في أي مكان
          BIN_DIR=$(find "$PWD/gonon-clang" -name "bin" -type d | head -1)
          if [ -n "$BIN_DIR" ]; then
            echo "✅ وجد bin في: $BIN_DIR"
            CLANG_PATH="$BIN_DIR"
          else
            echo "❌ لم يتم العثور على مجلد bin في Gonon Clang!"
            ls -la "$PWD/gonon-clang/"
            exit 1
          fi
        else
          CLANG_PATH="$PWD/gonon-clang/bin"
        fi
        
        rm -f gonon-clang.tar.gz
        
        # ⭐⭐ الكشف التلقائي عن إصدار Gonon Clang ⭐⭐
        echo "🔍 الكشف التلقائي عن Gonon Clang..."
        
        # البحث عن clang-* في Gonon Clang
        CLANG_BIN=$(find "$CLANG_PATH" -name "clang-[0-9]*" -type f | head -1)
        
        if [ -z "$CLANG_BIN" ]; then
          # محاولة أخرى: البحث عن clang بدون رقم
          CLANG_BIN=$(find "$CLANG_PATH" -name "clang" -type f ! -name "*.so" ! -name "*.dll" | head -1)
        fi
        
        if [ -z "$CLANG_BIN" ]; then
          echo "❌ لم يتم العثور على clang في $CLANG_PATH"
          echo "📋 محتويات مجلد Gonon Clang:"
          ls -la "$CLANG_PATH/" | head -30
          exit 1
        fi
        
        CLANG_BASENAME=$(basename "$CLANG_BIN")
        echo "✅ وجد Gonon Clang: $CLANG_BASENAME"
        
        # ⭐⭐ إنشاء رابط رمزي clang إذا لزم الأمر ⭐⭐
        if [ "$CLANG_BASENAME" != "clang" ] && [ ! -L "$CLANG_PATH/clang" ] && [ ! -f "$CLANG_PATH/clang" ]; then
          echo "🔗 إنشاء رابط رمزي: clang -> $CLANG_BASENAME"
          ln -sf "$CLANG_BASENAME" "$CLANG_PATH/clang"
        fi
        
        # ⭐⭐ البحث عن clang++ المقابل ⭐⭐
        CLANGPP_PATTERN=$(echo "$CLANG_BASENAME" | sed 's/^clang/clang++/')
        CLANGPP_BIN=$(find "$CLANG_PATH" -name "$CLANGPP_PATTERN" -type f | head -1)
        
        if [ -z "$CLANGPP_BIN" ]; then
          # البحث عن أي clang++
          CLANGPP_BIN=$(find "$CLANG_PATH" -name "clang++*" -type f | head -1)
        fi
        
        if [ -z "$CLANGPP_BIN" ]; then
          # إذا clang++ غير موجود، إنشائه من clang
          if [ ! -L "$CLANG_PATH/clang++" ] && [ ! -f "$CLANG_PATH/clang++" ]; then
            echo "🔗 إنشاء رابط رمزي: clang++ -> clang"
            ln -sf "clang" "$CLANG_PATH/clang++"
          fi
          CLANGPP_BASENAME="clang"
        else
          CLANGPP_BASENAME=$(basename "$CLANGPP_BIN")
          echo "✅ وجد Clang++: $CLANGPP_BASENAME"
          
          if [ ! -L "$CLANG_PATH/clang++" ] && [ ! -f "$CLANG_PATH/clang++" ]; then
            echo "🔗 إنشاء رابط رمزي: clang++ -> $CLANGPP_BASENAME"
            ln -sf "$CLANGPP_BASENAME" "$CLANG_PATH/clang++"
          fi
        fi
        
        # التحقق من أدوات LLVM الأساسية
        echo "🔧 التحقق من أدوات LLVM في Gonon Clang..."
        REQUIRED_TOOLS="llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip"
        for tool in $REQUIRED_TOOLS; do
          if [ -f "$CLANG_PATH/$tool" ]; then
            echo "✅ $tool موجود"
          else
            echo "⚠️  $tool غير موجود - قد يسبب مشاكل"
          fi
        done
        
        # ⭐⭐ إضافة: البحث عن أدوات ld.bfd ⭐⭐
        echo "🔍 البحث عن أدوات ld.bfd..."
        if [ -f "$CLANG_PATH/aarch64-linux-gnu-ld.bfd" ]; then
          echo "✅ aarch64-linux-gnu-ld.bfd موجود (3.91 ميجا)"
        fi
        if [ -f "$CLANG_PATH/arm-linux-gnueabi-ld.bfd" ]; then
          echo "✅ arm-linux-gnueabi-ld.bfd موجود (2.00 ميجا)"
        fi
        if [ -f "$CLANG_PATH/ld.bfd" ]; then
          echo "✅ ld.bfd موجود (2.70 ميجا)"
        fi
        
        echo "📋 محتويات مجلد Gonon Clang (مختصر):"
        ls -la "$CLANG_PATH/" | grep -E "^l.*clang|^[^d].*(clang|llvm|ld)" | head -15 2>/dev/null || true
        
        # ⭐⭐ إضافة: تعيين متغيرات LLVM ⭐⭐
        echo "🔧 تعيين متغيرات LLVM..."
        echo "AR=$CLANG_PATH/llvm-ar" >> $GITHUB_ENV
        echo "NM=$CLANG_PATH/llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=$CLANG_PATH/llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=$CLANG_PATH/llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=$CLANG_PATH/llvm-strip" >> $GITHUB_ENV
        
        # ⭐⭐ إضافة: استخدام aarch64-linux-gnu-ld.bfd للنواة 64-bit ⭐⭐
        if [ -f "$CLANG_PATH/aarch64-linux-gnu-ld.bfd" ]; then
          echo "LD=$CLANG_PATH/aarch64-linux-gnu-ld.bfd" >> $GITHUB_ENV
          echo "✅ استخدام aarch64-linux-gnu-ld.bfd للنواة 64-bit"
        elif [ -f "$CLANG_PATH/ld.bfd" ]; then
          echo "LD=$CLANG_PATH/ld.bfd" >> $GITHUB_ENV
          echo "⚠️  استخدام ld.bfd العام (قد يسبب مشاكل)"
        else
          echo "LD=aarch64-linux-gnu-ld.bfd" >> $GITHUB_ENV
          echo "❌ استخدام الافتراضي"
        fi
        
        echo "LDFLAGS=-fuse-ld=bfd" >> $GITHUB_ENV
        
        # إضافة إلى PATH
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        # حفظ معلومات Clang للمراحل التالية
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "CLANG_BIN_NAME=$CLANG_BASENAME" >> $GITHUB_ENV
        
        echo "🎯 Gonon Clang 18 جاهز! ($CLANG_BASENAME)"

    # 🆕 التحقق التلقائي من Gonon Clang
    - name: Verify Gonon Clang Auto-Detection
      run: |
        echo "🔍 التحقق التلقائي من Gonon Clang..."
        
        echo "📋 معلومات Gonon Clang المكتشف:"
        echo "CLANG_PATH: $CLANG_PATH"
        echo "CLANG_BIN_NAME: $CLANG_BIN_NAME"
        
        echo "🔎 البحث عن clang في PATH:"
        which clang || { echo "❌ clang غير موجود في PATH"; exit 1; }
        
        CLANG_ACTUAL=$(which clang)
        echo "✅ clang موجود في: $CLANG_ACTUAL"
        
        # التحقق من الرابط الرمزي
        if [ -L "$CLANG_ACTUAL" ]; then
          REAL_CLANG=$(readlink -f "$CLANG_ACTUAL")
          echo "🔗 clang هو رابط رمزي إلى: $REAL_CLANG"
          
          if [ -f "$REAL_CLANG" ]; then
            echo "✅ الملف الحقيقي موجود"
            echo "📊 حجم الملف: $(ls -lh "$REAL_CLANG" | awk '{print $5}')"
          else
            echo "❌ الملف الحقيقي غير موجود!"
            exit 1
          fi
        fi
        
        echo "📊 معلومات Gonon Clang:"
        clang --version | head -5
        
        # التحقق من الإصدار المحدد
        if [ -n "$CLANG_BIN_NAME" ]; then
          echo "🔍 التحقق من الإصدار المحدد ($CLANG_BIN_NAME):"
          "$CLANG_PATH/$CLANG_BIN_NAME" --version | head -3
        fi
        
        echo "✅ التحقق التلقائي من Gonon Clang اكتمل!"

    # 4️⃣ Export env
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel مع التحقق التلقائي
    - name: Build kernel
      shell: bash
      env:
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        CLANG_TRIPLE: aarch64-linux-gnu-
        # ⭐⭐ إضافة: متغيرات LLVM ⭐⭐
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
        LD: ${{ env.LD }}
        LDFLAGS: ${{ env.LDFLAGS }}
      run: |
        set -o pipefail
        mkdir -p logs
        
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء بناء النواة باستخدام Gonon Clang 18..."
        
        # التحقق النهائي التلقائي
        echo "🔍 التحقق النهائي التلقائي:"
        echo "🔧 Gonon Clang المستخدم: $(which clang)"
        echo "🔧 المسار الحقيقي: $(readlink -f $(which clang) 2>/dev/null || which clang)"
        echo "🔧 الإصدار المكتشف: $CLANG_BIN_NAME"
        
        echo "📋 معلومات Gonon Clang النهائية:"
        clang --version | head -3
        
        echo "🔧 CROSS_COMPILE: $CROSS_COMPILE"
        echo "🔧 CROSS_COMPILE_ARM32: $CROSS_COMPILE_ARM32"
        echo "🔧 CLANG_TRIPLE: $CLANG_TRIPLE"
        
        # ⭐⭐ إضافة: عرض أدوات LLVM ⭐⭐
        echo "🔧 أدوات LLVM المستخدمة:"
        echo "AR: $AR"
        echo "NM: $NM"
        echo "OBJCOPY: $OBJCOPY"
        echo "STRIP: $STRIP"
        echo "LD: $LD"
        echo "LDFLAGS: $LDFLAGS"
        
        # البناء باستخدام Gonon Clang المكتشف تلقائياً
        # ⭐⭐ إضافة: استخدام متغيرات LLVM في make ⭐⭐
        stdbuf -oL -eL make O=out -j$(nproc) \
        CC="ccache clang" \
        AR="$AR" \
        NM="$NM" \
        OBJCOPY="$OBJCOPY" \
        OBJDUMP="$OBJDUMP" \
        STRIP="$STRIP" \
        LD="$LD" \
        LDFLAGS="$LDFLAGS" \
        CLANG_TRIPLE="$CLANG_TRIPLE" \
        CROSS_COMPILE="$CROSS_COMPILE" \
        CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
        LLVM=1 \
        LLVM_IAS=1 \
        2>&1 | tee logs/build.log
        
        BUILD_STATUS=${PIPESTATUS[0]}
        
        ccache -s
        
        if [ $BUILD_STATUS -eq 0 ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح باستخدام Gonon $CLANG_BIN_NAME!"
            ls -lh out/arch/arm64/boot/Image.gz
        else
            echo "❌ فشل بناء النواة!"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    
    # 8️⃣ AnyKernel3 (تعديل الاسم)
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-gonon-clang-18.zip *
        cd ..
        
        echo "📏 حجم ZIP:"
        ls -lh Kernel-violet-gonon-clang-18.zip
        echo "✅ تم إنشاء ZIP"
    
    # 9️⃣ Sign ZIP (تعديل الاسم)
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-gonon-clang-18.zip Kernel-violet-gonon-clang-18-signed.zip
        
        echo "📏 حجم ZIP الموقّع:"
        ls -lh Kernel-violet-gonon-clang-18-signed.zip
        echo "✅ تم التوقيع"
    
    # 🔟 رفع ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Gonon-Clang-18-ZIP
        path: Kernel-violet-gonon-clang-18-signed.zip
    
    # 1️⃣1️⃣ رفع اللوغات والتحليلات
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis-Gonon
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt

    # ملخص البناء
    - name: Build Summary
      if: always()
      run: |
        echo "📊 ملخص البناء باستخدام Gonon Clang 18:"
        echo "================================"
        echo "🔧 Gonon Clang المستخدم: $CLANG_BIN_NAME"
        echo "📁 مسار Clang: $CLANG_PATH"
        echo ""
        # ⭐⭐ إضافة: عرض أدوات LLVM المستخدمة ⭐⭐
        echo "🛠️ أدوات LLVM المستخدمة:"
        echo "AR: $(basename $AR 2>/dev/null || echo 'N/A')"
        echo "NM: $(basename $NM 2>/dev/null || echo 'N/A')"
        echo "OBJCOPY: $(basename $OBJCOPY 2>/dev/null || echo 'N/A')"
        echo "STRIP: $(basename $STRIP 2>/dev/null || echo 'N/A')"
        echo "LD: $(basename $LD 2>/dev/null || echo 'N/A')"
        echo ""
        echo "✅ ملفات تم إنشاؤها:"
        ls -lh Kernel-violet-gonon-clang-18-signed.zip 2>/dev/null || echo "❌ ZIP غير موجود"
        ls -lh logs/build.log 2>/dev/null || echo "❌ اللوغ غير موجود"
        ls -lh nm-*.txt 2>/dev/null || echo "❌ ملفات التحليل غير موجودة"
        echo "================================"

name: Cleanup 25 Oldest Runs

on:
  workflow_dispatch: # تشغيل يدوياً
  push:
    branches:
      - sixteen # تشغيل عند الدفع لفرع sixteen

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete exactly 25 oldest runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "جاري جلب قائمة التشغيلات..."
          
          # جلب آخر 25 سجل من القائمة (الأقدم)
          run_ids=$(gh run list -R $REPO --limit 1000 --json databaseId --jq '.[].databaseId' | tail -n 25)

          if [ -z "$run_ids" ]; then
            echo "لم يتم العثور على سجلات تشغيل."
            exit 0
          fi

          echo "بدء حذف أقدم 25 سجل..."
          
          for id in $run_ids; do
            gh run delete $id -R $REPO
            echo "تم حذف التشغيل: $id"
          done

          echo "تمت المهمة بنجاح."
